---
- name: Verify LanguageTool systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for LanguageTool service to become active (up to 180s)
      ansible.builtin.systemd:
        name: languagetool.service
      register: languagetool_service
      until: languagetool_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert LanguageTool service is active
      ansible.builtin.assert:
        that: languagetool_service.status.ActiveState == 'active'
        fail_msg: "languagetool.service not active ({{ languagetool_service.status.ActiveState }})"
        success_msg: "languagetool.service is active"

    - name: Retrieve LanguageTool service log for debugging
      when: languagetool_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu languagetool.service
      changed_when: false

    - name: Wait for LanguageTool HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8010/v2/healthcheck"
        method: GET
        status_code: [200, 301, 302]
        follow_redirects: none
      register: languagetool_endpoint
      until: languagetool_endpoint.status in [200, 301, 302]
      retries: 120
      delay: 5

    - name: Assert LanguageTool HTTP endpoint responds
      ansible.builtin.assert:
        that: languagetool_endpoint.status in [200, 301, 302]
        fail_msg: "LanguageTool did not respond as expected ({{ languagetool_endpoint.status | default('no response') }})"
        success_msg: "LanguageTool responded with {{ languagetool_endpoint.status }}"

    - name: Show LanguageTool systemd service status summary
      ansible.builtin.debug:
        msg:
          - "LanguageTool systemd: {{ languagetool_service.status.ActiveState }}"
          - "LanguageTool HTTP: {{ languagetool_endpoint.status }}"
